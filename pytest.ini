# Default `pytest` runs the canonical Flask product suite (server/) plus the
# root FINAL-record tests. The FastAPI AI suite has its own async config and is
# run explicitly:  cd ai_pipeline && python -m pytest -p no:asyncio
# The P2_PramaanX/ scripts are demo baselines (cwd-relative fixtures), not unit
# tests, so they are excluded from default collection.
[pytest]
addopts = -p no:asyncio
testpaths =
    server
    test_p4_final.py
